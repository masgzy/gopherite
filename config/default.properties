# Gopherite default configuration (embedded in the binary).
# On first launch this file is written next to the binary; edit freely and
# restart. Deleting the file restores the embedded defaults.

# TCP port players connect to.
server-port=25565

# Address to bind. Leave empty for all interfaces.
server-ip=

# Message of the day shown in the server list. Supports legacy color codes.
motd=A Gopherite Server

# Maximum number of players advertised and accepted.
max-players=20

# Online-mode=true validates accounts against Mojang session servers.
# Offline mode assigns offline UUIDs. (Both paths activate in M2; the value
# is stored and advertised already.)
online-mode=true

# Packet compression threshold in bytes; -1 disables. (Applied in M2.)
network-compression-threshold=256

# 64x64 PNG icon shown in the server list. Empty disables the icon.
# File name relative to the working directory.
server-icon=

# Seconds a connection may stay silent during handshake/status.
read-timeout=30
