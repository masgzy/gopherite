# Gopherite 默认配置（内嵌于二进制）。
# 首次启动时本文件会被写出到运行目录；随意编辑后重启即可生效。
# 删除本文件将恢复内嵌默认值。

# 玩家连接使用的 TCP 端口。
server-port=25565

# 绑定地址。留空表示监听所有网卡。
server-ip=

# 服务器列表中显示的公告（MOTD）。支持旧版颜色代码（§）。
motd=A Gopherite Server

# 对外展示并允许进入的最大玩家数。
max-players=20

# 正版验证开关。true 时通过 Mojang 会话服务器校验账号；
# false 时按原版规则派生离线 UUID。
online-mode=true

# 网络压缩阈值（字节）；-1 表示禁用。
network-compression-threshold=256

# 服务器列表显示的 64x64 PNG 图标。留空禁用图标。
# 文件名相对运行目录。
server-icon=

# 世界存档目录名（与原版 level-name 一致）。存档以 Anvil
# 区域文件（.mca）保存在 <level-name>/region/ 下，可被原版
# 客户端与工具直接读取。
level-name=world

# 服务端视距上限（区块半径，2-32）。客户端请求的视距
# 超过此值时按此值截断；实际发送半径取两者较小值。
view-distance=8

# 握手与状态阶段允许连接保持静默的秒数。
read-timeout=30

# 单个数据包写入的最长等待秒数。客户端停止读取（慢客户端）会写满
# TCP 发送缓冲并阻塞广播，到达此期限即断开该连接。
write-timeout=10

# 智能 GC 调控（Gopherite 扩展）。开启后按实况负载动态调节 GOGC：
# 分配高峰时更早更频繁地回收以压短停顿，空闲时放宽以节省 CPU；
# 并为运行时设定软内存天花板（GOMEMLIMIT）防止被 OOM Killer 击杀。
gc-tuning=true

# GC 暂停 P99 目标（毫秒）。持续超出且分配速率过热时收紧 GOGC。
gc-target-pause-ms=2

# 内存天花板（MiB）。0 = 自动探测：取 cgroup 上限与系统内存中较小者
# 的 90%。容器部署建议显式设为容器限额的约 90%。
gc-mem-limit-mib=0

# GOGC 调控档位与启动基线。
gc-min-gogc=20
gc-max-gogc=300
gc-base-gogc=100

# 采样与决策周期（秒）。
gc-sample-interval=1
